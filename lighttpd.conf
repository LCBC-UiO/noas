server.document-root = "/app/webui/www"
server.port = env.WEBUI_PORT
server.modules = (
       "mod_expire",
       "mod_access",
       "mod_accesslog",
       "mod_setenv",
       "mod_extforward",
       "mod_auth",
       "mod_cgi",
       "mod_fastcgi"
)
mimetype.assign = (
  ".html" => "text/html",
  ".txt" => "text/plain",
  ".jpg" => "image/jpeg",
  ".png" => "image/png",
  ".ico" => "image/x-icon",
  ".svg" => "image/svg+xml",
  ".mp3" => "audio/mpeg",
  ".css" => "text/css",
  ".js"  => "text/javascript",
  ".json" => "application/json"
)
# enable directoy listing without index.html
server.dir-listing = "disable"
dir-listing.activate = "disable"
server.follow-symlink = "enable"

# setenv.add-environment = ( 
#   "DBHOST" => env.DBHOST,
#   "DBPORT" => env.DBPORT,
#   "DBNAME" => env.DBNAME,
#   "DBUSER" => env.DBUSER,
# #  "R_LIBS_USER" => env.R_LIBS_USER # R packages should be found in standard paths within rocker image
# )

#log 
server.breakagelog = "/dev/stderr"
server.errorlog    = "/dev/stderr"
accesslog.filename = "/dev/stderr"

index-file.names = ( "index.html" )

cgi.assign = ( 
  ".cgi" => ""
)

# Ensure the runtime directory for the socket exists and lighttpd can write to it.
# We will mount the host's ./run directory to /app/run in the container.
fastcgi.server = ( ".php" =>
  ((
    "socket" => "/app/run/php.socket", # Path inside the container mount
    "bin-path" => "/usr/bin/php-cgi", # Standard path after apt install
    "bin-environment" => (
      "PHP_FCGI_CHILDREN" => "4", # Reduced from 16 for typical container use
      "PHP_FCGI_MAX_REQUESTS" => "1000" # Reduced from 10000
    ),
    "min-procs" => 1,
    "max-procs" => 1, # Consider increasing if PHP load is high
    "idle-timeout" => 20
  ))
)

